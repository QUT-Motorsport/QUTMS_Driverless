name: pre-commit Check
on: [push]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
